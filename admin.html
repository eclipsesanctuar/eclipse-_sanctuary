<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d1b">
  <title>Administración | ECLIPSE : Sanctuary</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #100d1b;
      color: #f4efff;
      font-family: Georgia, serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #51416d;
      border-radius: 18px;
      background: #1b1628;
      box-shadow: 0 20px 60px #0006;
    }

    .moon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      letter-spacing: 2px;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #bcb0d3;
      font-size: 14px;
      margin: 0 0 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #63527c;
      border-radius: 8px;
      background: #100d1b;
      color: white;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #ad8be8;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #b59add;
      color: #180f27;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      margin: 16px 0 0;
      text-align: center;
      font: 14px/1.5 Arial, sans-serif;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #cbb8ed;
      font: 13px Arial, sans-serif;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="moon" aria-hidden="true">☾</div>
    <h1>ECLIPSE : Sanctuary</h1>
    <p class="subtitle">Acceso reservado a administradores</p>

    <form id="login-form">
      <label for="username">Nombre de usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        maxlength="64"
        required
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        maxlength="256"
        required
      >

      <button id="submit-button" type="submit">
        Entrar al santuario
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a class="back" href="./index.html">Volver al inicio</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://oflletoswulovqfrxqpc.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_keXgvW4C3G8zgfNnjIqJBw_zSoqf-N";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const form = document.querySelector("#login-form");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;

      try {
        const username =
          document.querySelector("#username").value.trim();

        const password =
          document.querySelector("#password").value;

        const { data, error } =
          await supabase.functions.invoke("username-login", {
            body: { username, password }
          });

        if (error) {
          let detail = error.message || String(error);

          if (error.context instanceof Response) {
            try {
              const responseText =
                await error.context.clone().text();

              if (responseText) {
                detail += " | Respuesta: " +
                  responseText.slice(0, 300);
              }
            } catch {
              // Conserva el mensaje original.
            }
          }

          throw new Error(detail);
        }

        if (!data?.access_token || !data?.refresh_token) {
          throw new Error(
            data?.error ||
            data?.message ||
            "La función no devolvió los tokens de sesión. " +
            "Respuesta: " + JSON.stringify(data).slice(0, 300)
          );
        }

        const { error: sessionError } =
          await supabase.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });

        if (sessionError) {
          throw new Error(
            "No se pudo crear la sesión: " +
            sessionError.message
          );
        }

        message.textContent = "Acceso verificado.";

        window.location.href = "./admin-panel.html";

      } catch (error) {
        console.error("Error de acceso:", error);

        const detail = error instanceof Error
          ? error.message
          : String(error);

        message.textContent =
          "Error de diagnóstico: " + detail;

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

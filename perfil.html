<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil · ECLIPSE : Sanctuary</title>
<style>
:root{--bg:#090b12;--panel:#111521;--line:#35384a;--text:#f4f1f5;--muted:#b4b5c5;--gold:#d8c18a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Georgia,serif;background:radial-gradient(ellipse at 12% 8%,#50172455,transparent 35%),radial-gradient(ellipse at 90% 18%,#1b367155,transparent 34%),var(--bg)}header{padding:18px 5vw;border-bottom:1px solid #ffffff18}nav{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{letter-spacing:2px}a{color:var(--gold);text-decoration:none}.btn{display:inline-block;border:1px solid var(--line);padding:10px 13px;border-radius:999px;color:var(--text);font:13px Arial,sans-serif;background:linear-gradient(110deg,#6c1d30,#26376d);cursor:pointer}main{max-width:760px;margin:auto;padding:30px 16px}.panel{padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#161a29f2,#0f121cf2)}h1{font-size:clamp(27px,6vw,42px);font-weight:normal}p,.status{font:13px/1.7 Arial,sans-serif;color:var(--muted);overflow-wrap:anywhere}.profile{text-align:center;padding:20px 0}.avatar{width:144px;height:144px;margin:0 auto 15px;border:2px solid var(--gold);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#562033,#25396d,#1a4c3b);font-size:48px}.avatar img{width:100%;height:100%;object-fit:cover}label{display:block;margin:16px 0;font:13px Arial,sans-serif;color:var(--muted)}input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#090c15;color:white}.status{min-height:22px}.error{color:#ffb8c2}.success{color:#b8f0ce}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}[hidden]{display:none!important}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><nav><div class="brand">✦ ECLIPSE : SANCTUARY</div><a href="./index.html">← Volver al santuario</a></nav></header><main><section class="panel"><h1>✦ Mi perfil</h1><p>Elige una foto para tu cuenta. Se guardará en tu perfil y seguirá ahí cuando vuelvas a iniciar sesión.</p><div id="signedOut" class="status" hidden>No has iniciado sesión. <a href="./index.html">Vuelve al santuario e inicia sesión</a>.</div><div id="profileArea" hidden><div class="profile"><div class="avatar" id="avatarPreview">✧</div><div id="profileUsername"></div></div><form id="avatarForm"><label>Selecciona una foto (JPG, PNG, WebP o GIF; máximo 5 MB)<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><div class="actions"><button class="btn" id="saveButton" type="submit">Guardar foto de perfil</button><a class="btn" href="./index.html">Volver</a></div><div id="message" class="status" aria-live="polite"></div></form></div></section></main>
<script>
(()=>{"use strict";const SUPABASE_URL="https://oflletoswulovqfrxqpc.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_keXgvW4C3G8zgfNnjIqJBw_zWSoqf-N";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);let session=null,previewUrl=null;function message(text,type=""){$("message").textContent=text;$("message").className="status "+type}function showPhoto(url){const box=$("avatarPreview");box.replaceChildren();if(url){const img=document.createElement("img");img.src=url;img.alt="Foto de perfil";img.onerror=()=>{box.replaceChildren();box.textContent="✧"};box.append(img)}else box.textContent="✧"}async function init(){const {data,error}=await supabase.auth.getSession();if(error)throw error;session=data.session;$("signedOut").hidden=!!session;$("profileArea").hidden=!session;if(!session)return;const {data:p,error:e}=await supabase.from("profiles").select("username,photo_url").eq("user_id",session.user.id).maybeSingle();if(e)throw e;$("profileUsername").textContent=p?.username?"@"+p.username:"Mi cuenta";showPhoto(p?.photo_url||"")} $("avatarFile").addEventListener("change",()=>{const f=$("avatarFile").files?.[0];if(!f)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(f);showPhoto(previewUrl);message("")});$("avatarForm").addEventListener("submit",async e=>{e.preventDefault();const file=$("avatarFile").files?.[0];if(!session){message("Inicia sesión primero.","error");return}if(!file){message("Selecciona una imagen.","error");return}if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){message("Usa JPG, PNG, WebP o GIF.","error");return}if(file.size>5*1024*1024){message("La imagen supera el límite de 5 MB.","error");return}const button=$("saveButton");button.disabled=true;message("Subiendo tu foto…");try{const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"}[file.type];const path=session.user.id+"/avatar-"+Date.now()+"."+ext;const {error:uploadError}=await supabase.storage.from("avatars").upload(path,file,{contentType:file.type,upsert:false,cacheControl:"3600"});if(uploadError)throw uploadError;const {data:u}=supabase.storage.from("avatars").getPublicUrl(path);const {error:updateError}=await supabase.rpc("update_my_avatar",{p_photo_url:u.publicUrl});if(updateError)throw updateError;showPhoto(u.publicUrl);$("avatarFile").value="";message("¡Foto guardada! Ya está vinculada a tu perfil.","success")}catch(err){console.error(err);message(err.message||"No se pudo guardar la foto. Comprueba el bucket y las políticas de Storage.","error")}finally{button.disabled=false}});init().catch(err=>{console.error(err);$("signedOut").hidden=false;$("signedOut").textContent="No se pudo cargar tu perfil: "+(err.message||"error desconocido")})})();
</script></body></html>

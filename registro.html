<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | ECLIPSE : Sanctuary</title>

  <style>
    :root {
      --bg: #100b17;
      --panel: #1d1425;
      --input: #130d1b;
      --lilac: #d4b5f0;
      --text: #f6effb;
      --muted: #cbbbd7;
      --border: #624b72;
      --error: #ffb8c2;
      --success: #b8f0ce;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .panel {
      width: 100%;
      max-width: 620px;
      padding: 34px 30px;
      border: 1px solid var(--border);
      border-radius: 36px;
      background: var(--panel);
      box-shadow: 0 15px 45px #0004;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: clamp(28px, 6vw, 38px);
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 22px 0 12px;
      font-size: 25px;
    }

    input {
      display: block;
      width: 100%;
      min-height: 76px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 17px;
      outline: none;
      background: var(--input);
      color: white;
      font: 20px Arial, sans-serif;
    }

    input:focus {
      border-color: var(--lilac);
      box-shadow: 0 0 0 2px #d4b5f033;
    }

    .hint {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 76px;
      margin-top: 30px;
      border: 0;
      border-radius: 17px;
      background: var(--lilac);
      color: #1c1027;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      min-height: 30px;
      margin: 22px 0;
      font-size: 19px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      color: var(--error);
    }

    #message.success {
      color: var(--success);
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      font-size: 21px;
    }

    a {
      color: var(--lilac);
    }

    @media (max-width: 420px) {
      .panel {
        padding: 28px 20px;
      }

      .intro {
        font-size: 19px;
      }

      label {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Únete al santuario</h1>

    <p class="intro">
      Crea tu cuenta y encuentra tu lugar en el santuario.
    </p>

    <form id="registerForm">
      <label for="username">Nombre de usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        pattern="[A-Za-z0-9_]{3,24}"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >
      <p class="hint">
        Entre 3 y 24 caracteres. Puedes usar letras, números y _.
      </p>

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >
      <p class="hint">Usa al menos 8 caracteres.</p>

      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        Crear cuenta
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <nav class="links">
      <a href="./login.html">Ir a iniciar sesión</a>
      <a href="./index.html">Volver al inicio</a>
    </nav>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://oflletoswulovqfrxqpc.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_keXgvW4C3G8zgfNnjIqJBw_zWSoqf-N";

    // IMPORTANTE: el guion final coincide con el nombre de tu función.
    const REGISTER_FUNCTION = "username-register-";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("registerForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = type;
    }

    async function explainError(error) {
      const response = error?.context;

      if (response && typeof response.clone === "function") {
        const status = response.status;
        const body = await response.clone().json().catch(() => null);

        if (body?.error) {
          return body.error;
        }

        if (status) {
          return `Error HTTP ${status}. Revisa que la función esté desplegada y que sus permisos sean correctos.`;
        }
      }

      if (error?.message) {
        return error.message;
      }

      return "No se pudo contactar con el servidor de registro.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
        showMessage(
          "El usuario debe tener entre 3 y 24 caracteres y usar solo letras, números o _."
        );
        return;
      }

      if (password.length < 8 || password.length > 72) {
        showMessage("La contraseña debe tener entre 8 y 72 caracteres.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Las contraseñas no coinciden.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creando cuenta…";
      showMessage("Estamos preparando tu lugar en el santuario.", "success");

      try {
        const { data, error } = await supabase.functions.invoke(
          REGISTER_FUNCTION,
          {
            body: { username, password }
          }
        );

        if (error) {
          throw new Error(await explainError(error));
        }

        if (data?.error) {
          throw new Error(data.error);
        }

        // Si la función devuelve sesión, la guardamos.
        // Si no, iniciamos sesión mediante username-login.
        if (data?.access_token && data?.refresh_token) {
          const { error: sessionError } = await supabase.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });

          if (sessionError) {
            throw sessionError;
          }
        } else {
          const { data: loginData, error: loginError } =
            await supabase.functions.invoke("username-login", {
              body: { username, password }
            });

          if (loginError) {
            throw new Error(await explainError(loginError));
          }

          if (loginData?.error) {
            throw new Error(loginData.error);
          }

          if (!loginData?.access_token || !loginData?.refresh_token) {
            throw new Error(
              "La cuenta se creó, pero no se recibió una sesión de inicio de sesión."
            );
          }

          const { error: sessionError } = await supabase.auth.setSession({
            access_token: loginData.access_token,
            refresh_token: loginData.refresh_token
          });

          if (sessionError) {
            throw sessionError;
          }
        }

        showMessage("¡Cuenta creada! Entrando al santuario…", "success");

        window.location.replace("./index.html");
      } catch (error) {
        console.error("Error de registro:", error);
        showMessage(
          error?.message || "No se pudo completar el registro."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Crear cuenta";
      }
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c19">
  <title>Crear cuenta | ECLIPSE : Sanctuary</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #100c19;
      --panel: #1c1528;
      --border: #59416c;
      --text: #f4eafa;
      --muted: #c9bad8;
      --accent: #b89ad8;
      --accent-hover: #d1b6ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #352044 0%, transparent 55%),
        var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(28, 21, 40, 0.96);
      box-shadow: 0 20px 70px #0007;
    }

    .moon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: clamp(25px, 6vw, 34px);
      margin: 0 0 12px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #69517d;
      background: #120e1b;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      background: var(--accent);
      color: #1a1024;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.6;
      margin-top: 18px;
    }

    .links {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      line-height: 1.8;
    }

    a { color: #d8bafa; }

    @media (max-width: 420px) {
      main { padding: 23px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="moon" aria-hidden="true">☾</div>
    <h1>ECLIPSE : Sanctuary</h1>

    <p class="subtitle">
      Crea tu cuenta y encuentra tu lugar en el santuario.
    </p>

    <form id="register-form">
      <label for="username">Nombre de usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        pattern="[A-Za-z0-9_]{3,24}"
        title="Usa entre 3 y 24 letras, números o guiones bajos."
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >
      <p class="hint">
        Entre 3 y 24 caracteres. Puedes usar letras, números y _.
      </p>

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >
      <p class="hint">Usa al menos 8 caracteres.</p>

      <label for="confirm-password">Confirmar contraseña</label>
      <input
        id="confirm-password"
        name="confirm-password"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >

      <button id="submit-button" type="submit">
        Crear cuenta
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      <a href="./admin.html">Ir a iniciar sesión</a>
      <br>
      <a href="./index.html">Volver al inicio</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://oflletoswulovqfrxqpc.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_keXgvW4C3G8zgfNnjIqJBw_zWSoqf-N";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const form = document.querySelector("#register-form");
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const confirmInput = document.querySelector("#confirm-password");
    const message = document.querySelector("#message");
    const button = document.querySelector("#submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        message.textContent =
          "El nombre debe tener entre 3 y 24 letras, números o guiones bajos.";
        return;
      }

      if (password.length < 8 || password.length > 72) {
        message.textContent =
          "La contraseña debe tener entre 8 y 72 caracteres.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "Las contraseñas no coinciden.";
        confirmInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Creando cuenta...";

      try {
        const { data, error } = await supabase.functions.invoke(
          "username-register",
          {
            body: { username, password }
          }
        );

        if (error) {
          throw new Error(
            data?.error || "No se pudo contactar con el servidor de registro."
          );
        }

        if (!data?.success) {
          throw new Error(
            data?.error || "No se pudo crear la cuenta."
          );
        }

        message.textContent =
          "Cuenta creada. Iniciando sesión...";

        const { data: login, error: loginError } =
          await supabase.functions.invoke(
            "username-login",
            {
              body: { username, password }
            }
          );

        if (
          loginError ||
          !login?.access_token ||
          !login?.refresh_token
        ) {
          message.textContent =
            "Tu cuenta se creó correctamente. Ahora puedes iniciar sesión desde la página de acceso.";
          return;
        }

        const { error: sessionError } =
          await supabase.auth.setSession({
            access_token: login.access_token,
            refresh_token: login.refresh_token
          });

        if (sessionError) {
          message.textContent =
            "Tu cuenta se creó correctamente. Ve a iniciar sesión para entrar.";
          return;
        }

        message.textContent =
          "¡Bienvenido al santuario!";

        // Cambia este destino si tu página pública para miembros
        // tiene otro nombre. No redirigir usuarios normales al panel admin.
        window.location.assign("./index.html");

      } catch (error) {
        message.textContent =
          error?.message ||
          "Ocurrió un error. Inténtalo de nuevo más tarde.";
      } finally {
        button.disabled = false;
        button.textContent = "Crear cuenta";
      }
    });
  </script>
</body>
</html>

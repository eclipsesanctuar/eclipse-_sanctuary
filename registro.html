<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | ECLIPSE : Sanctuary</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #100b17;
      color: #f6effb;
      font-family: Georgia, "Times New Roman", serif;
    }

    .panel {
      width: 100%;
      max-width: 620px;
      padding: 34px 30px;
      border: 1px solid #624b72;
      border-radius: 36px;
      background: #1d1425;
      box-shadow: 0 15px 45px #0004;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: clamp(28px, 6vw, 38px);
    }

    .intro {
      margin: 0 0 28px;
      color: #cbbbd7;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 22px 0 12px;
      font-size: 25px;
    }

    input {
      display: block;
      width: 100%;
      min-height: 76px;
      padding: 18px;
      border: 1px solid #624b72;
      border-radius: 17px;
      outline: none;
      background: #130d1b;
      color: white;
      font: 20px Arial, sans-serif;
    }

    input:focus {
      border-color: #d4b5f0;
      box-shadow: 0 0 0 2px #d4b5f033;
    }

    .hint {
      margin: 14px 0 24px;
      color: #cbbbd7;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 76px;
      margin-top: 30px;
      border: 0;
      border-radius: 17px;
      background: #d4b5f0;
      color: #1c1027;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      margin: 22px 0;
      font-size: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #message.error { color: #ffb8c2; }
    #message.success { color: #b8f0ce; }

    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      font-size: 21px;
    }

    a { color: #d4b5f0; }

    @media (max-width: 420px) {
      .panel { padding: 28px 20px; }
      .intro { font-size: 19px; }
      label { font-size: 22px; }
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Únete al santuario</h1>

    <p class="intro">
      Crea tu cuenta y encuentra tu lugar en el santuario.
    </p>

    <form id="registerForm">
      <label for="username">Nombre de usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        pattern="[A-Za-z0-9_]{3,24}"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <p class="hint">
        Entre 3 y 24 caracteres. Puedes usar letras, números y _.
      </p>

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >

      <p class="hint">Usa al menos 8 caracteres.</p>

      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        Crear cuenta
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <nav class="links">
      <a href="./login.html">Ir a iniciar sesión</a>
      <a href="./index.html">Volver al inicio</a>
    </nav>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://oflletoswulovqfrxqpc.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_keXgvW4C3G8zgfNnjIqJBw_zWSoqf-N";

    // Función exclusiva para registrar usuarios normales.
    const REGISTER_FUNCTION = "username-register-";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("registerForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = type;
    }

    async function getErrorDetails(error) {
      let details = error?.message || String(error);
      const response = error?.context;

      if (response && typeof response.clone === "function") {
        details += ` | HTTP ${response.status}`;

        try {
          const body = await response.clone().text();
          if (body) {
            details += ` | ${body.slice(0, 500)}`;
          }
        } catch (_) {}
      }

      return details;
    }

    async function callFunction(name, body) {
      const { data, error } = await supabase.functions.invoke(name, {
        body
      });

      if (error) {
        throw new Error(await getErrorDetails(error));
      }

      if (data?.error) {
        throw new Error(data.error);
      }

      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
        showMessage(
          "El usuario debe tener entre 3 y 24 caracteres y solo usar letras, números o _."
        );
        return;
      }

      if (password.length < 8 || password.length > 72) {
        showMessage(
          "La contraseña debe tener entre 8 y 72 caracteres."
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Las contraseñas no coinciden.");
        confirmInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Creando cuenta...";
      showMessage("Conectando con el santuario...", "success");

      try {
        // Esta función crea la cuenta y el perfil.
        // No se llama a username-login porque es solo para admins.
        const data = await callFunction(REGISTER_FUNCTION, {
          username,
          password
        });

        if (data?.success !== true) {
          throw new Error(
            data?.message ||
            "El servidor no confirmó la creación de la cuenta."
          );
        }

        showMessage(
          "¡Cuenta creada! Ahora inicia sesión con tu usuario y contraseña.",
          "success"
        );

        // El usuario inicia sesión desde la página normal.
        window.location.replace("./index.html");
      } catch (error) {
        console.error("Error de registro:", error);

        showMessage(
          "No se pudo completar el registro:\n" +
          (error.message || String(error))
        );
      } finally {
        button.disabled = false;
        button.textContent = "Crear cuenta";
      }
    });
  </script>
</body>
</html>
